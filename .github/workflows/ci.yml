name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relai
          POSTGRES_PASSWORD: relai
          POSTGRES_DB: relai
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The api suite pins DATABASE_URL to this in its vitest config, so the dev
      # database can never be reached. Port 5432 here, unlike 5433 locally, where
      # the mapping avoids colliding with other local Postgres instances.
      TEST_DATABASE_URL: postgresql://relai:relai@localhost:5432/relai_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create the test database
        run: PGPASSWORD=relai psql -h localhost -U relai -d relai -c 'CREATE DATABASE relai_test'

      - name: Apply migrations
        run: pnpm --filter @getrelai/db db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - run: pnpm typecheck

      - run: pnpm test
